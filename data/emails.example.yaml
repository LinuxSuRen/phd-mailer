# 复制为 emails.yaml 并填入真实信息；emails.yaml 与发送台账均被 .gitignore 排除，不会进入 git
version: 1

sender:
  name: 张三
  phone_wechat: "13800000000"
  title_line: "某某公司 CTO"

smtp:
  host: smtp.qq.com
  port: 465
  user: ""            # 也可用环境变量 PHD_MAILER_SMTP_USER
  auth_code: ""       # QQ 邮箱 SMTP 授权码（非登录密码）
  sender_name: 张三

defaults:
  interval_seconds: 60   # 批量发送时相邻两封的间隔（限速）

contacts:
  - id: example-university-professor-a   # 全局唯一，去重主键之一
    name: 某老师
    university: 某大学
    department: 某学院
    email: someone@example.edu
    priority: 1             # 越小越先发送
    tags: [示例]
    subject: 博士申请咨询｜某方向·张三
    body: |
      某老师您好！

      这里是邮件正文，发送时会自动在末尾拼接 sender 中的签名（姓名与联系方式）。
